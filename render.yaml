services:
  - type: web
    name: ai-incident-copilot
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-incident-copilot-db
          property: connectionString

databases:
  - name: ai-incident-copilot-db
    region: oregon
    plan: free
    databaseName: incidents
    ipAllowList: []
